name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SAL_REPO: ${{ vars.SAL_REPO || format('{0}/sal', github.repository_owner) }}
      SAL_VERSION: ${{ vars.SAL_VERSION || 'latest' }}
      SOSO_REPO: ${{ vars.SOSO_REPO || format('{0}/soso', github.repository_owner) }}
      SOSO_REF: ${{ vars.SOSO_REF || 'main' }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolver la etiqueta de sal
        id: sal-etiqueta
        run: echo "etiqueta=$(./scripts/obtener-sal.sh --etiqueta)" >> "$GITHUB_OUTPUT"

      - name: Cachear el compilador sal
        uses: actions/cache@v4
        with:
          path: target/toolchain
          key: sal-${{ runner.os }}-${{ env.SAL_REPO }}-${{ steps.sal-etiqueta.outputs.etiqueta }}

      - name: Preparar el compilador sal
        env:
          SAL_VERSION: ${{ steps.sal-etiqueta.outputs.etiqueta }}
        run: ./scripts/preparar-sal.sh >> "$GITHUB_ENV"

      - name: Compilar salvi para Linux
        run: ./build.sh linux

      - name: Pruebas en una pty
        run: python3 tests/run_tests.py ./salvi

      - name: Empaquetar el binario de Linux
        run: |
          mkdir -p dist/linux
          cp salvi README.md LICENSE dist/linux/
          tar czf "salvi-${GITHUB_REF_NAME#v}-x86_64-linux.tar.gz" -C dist/linux .

      - name: Situar y clonar soso
        id: soso
        run: |
          dir="$(dirname "$GITHUB_WORKSPACE")/soso"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          git clone --depth 1 --branch "$SOSO_REF" \
            "https://github.com/$SOSO_REPO.git" "$dir"
          sha=
          if json=$(curl -fsSL "https://api.github.com/repos/$SOSO_REPO/commits/$SOSO_REF"); then
            sha=$(printf '%s' "$json" | jq -r '.sha // empty')
          fi
          [ -n "$sha" ] || sha=$SOSO_REF
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Cachear el build de soso
        uses: actions/cache@v4
        with:
          path: ${{ steps.soso.outputs.dir }}/target
          key: soso-${{ runner.os }}-${{ env.SOSO_REPO }}-${{ steps.soso.outputs.sha }}
          restore-keys: |
            soso-${{ runner.os }}-${{ env.SOSO_REPO }}-

      - name: Preparar el SDK de Sal
        run: |
          soso="$(dirname "$GITHUB_WORKSPACE")/soso"
          sal="$(dirname "$GITHUB_WORKSPACE")/sal"
          pin=$(sed -n 's/^base=//p' "$soso/config/sal-source.lock")
          # El árbol de sal viene del tag de la release; soso fija otro commit
          # en config/sal-source.lock y el SDK solo se genera con ese.
          git -C "$sal" fetch --depth 1 origin "$pin"
          git -C "$sal" checkout --detach "$pin"
          cd "$soso"
          cargo xtask sal-build --cross-only

      - name: Compilar el paquete de soso
        run: |
          cd "$(dirname "$GITHUB_WORKSPACE")/soso"
          cargo xtask pkg-pack salvi

      - name: Empaquetar el paquete de soso
        run: |
          base="$(dirname "$GITHUB_WORKSPACE")/soso/rootfs/share/paquetes/salvi"
          version=$(ls -1 "$base" | sort -V | tail -n 1)
          if [ "$version" != "${GITHUB_REF_NAME#v}" ]; then
            echo "::warning::el paquete generado es $version y el tag $GITHUB_REF_NAME:" \
              "sube SALVI_VERSION en soso/xtask/src/pkg_pack.rs"
          fi
          mkdir -p dist/soso
          cp "$base/$version/paquete.txt" "$base/$version/paquete.pack" dist/soso/
          tar czf "salvi-$version-soso.tar.gz" -C dist/soso .

      - name: Publicar la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$GITHUB_REF_NAME" in
          *-*) extra=--prerelease ;;
          *) extra= ;;
          esac
          gh release create "$GITHUB_REF_NAME" salvi-*.tar.gz \
            --title "salvi $GITHUB_REF_NAME" --generate-notes $extra
