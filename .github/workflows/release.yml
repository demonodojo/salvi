name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Descargar el compilador sal
        id: sal
        env:
          SAL_REPO: ${{ vars.SAL_REPO || format('{0}/sal', github.repository_owner) }}
          SAL_VERSION: ${{ vars.SAL_VERSION || 'latest' }}
        run: echo "ruta=$(./scripts/obtener-sal.sh target/toolchain)" >> "$GITHUB_OUTPUT"

      - name: Dejar el compilador en ../sal
        env:
          SAL: ${{ steps.sal.outputs.ruta }}
        run: |
          mkdir -p "$(dirname "$GITHUB_WORKSPACE")/sal/target/release"
          install -m 755 "$SAL" "$(dirname "$GITHUB_WORKSPACE")/sal/target/release/sal"

      - name: Compilar salvi para Linux
        env:
          SAL: ${{ steps.sal.outputs.ruta }}
        run: ./build.sh linux

      - name: Pruebas en una pty
        run: python3 tests/run_tests.py ./salvi

      - name: Empaquetar el binario de Linux
        run: |
          mkdir -p dist/linux
          cp salvi README.md dist/linux/
          tar czf "salvi-${GITHUB_REF_NAME#v}-x86_64-linux.tar.gz" -C dist/linux .

      - name: Clonar soso
        env:
          SOSO_REPO: ${{ vars.SOSO_REPO || format('{0}/soso', github.repository_owner) }}
          SOSO_REF: ${{ vars.SOSO_REF || 'main' }}
        run: |
          git clone --depth 1 --branch "$SOSO_REF" \
            "https://github.com/$SOSO_REPO.git" "$(dirname "$GITHUB_WORKSPACE")/soso"

      - name: Compilar el paquete de soso
        env:
          SAL: ../sal/target/release/sal
        run: |
          cd "$(dirname "$GITHUB_WORKSPACE")/soso"
          cargo xtask pkg-pack salvi

      - name: Empaquetar el paquete de soso
        run: |
          base="$(dirname "$GITHUB_WORKSPACE")/soso/rootfs/share/paquetes/salvi"
          version=$(ls -1 "$base" | sort -V | tail -n 1)
          if [ "$version" != "${GITHUB_REF_NAME#v}" ]; then
            echo "::warning::el paquete generado es $version y el tag $GITHUB_REF_NAME:" \
              "sube SALVI_VERSION en soso/xtask/src/pkg_pack.rs"
          fi
          mkdir -p dist/soso
          cp "$base/$version/paquete.txt" "$base/$version/paquete.pack" dist/soso/
          tar czf "salvi-$version-soso.tar.gz" -C dist/soso .

      - name: Publicar la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$GITHUB_REF_NAME" in
          *-*) extra=--prerelease ;;
          *) extra= ;;
          esac
          gh release create "$GITHUB_REF_NAME" salvi-*.tar.gz \
            --title "salvi $GITHUB_REF_NAME" --generate-notes $extra
